name: Wayco
description: >-
  Wayco (Wayco AI, Inc.) is a Y Combinator (W26) startup building an AI operator
  for medical-legal cases. Its platform automates personal-injury and mass-tort
  case workflows end to end: AI voice agents answer and triage intake calls, match
  patients to medical providers by case type and location, coordinate telemedicine,
  summarize and analyze medical records at scale, and manage lead follow-up from
  first intake toward settlement. Founded by Iqbol Temirkhojaev and based in New
  York City, the company serves law firms, medical-billing, and insurance-claims
  teams. As of July 2026 Wayco is early stage and publishes a marketing site
  (wayco.ai) only, with no public developer API, documentation, or machine-readable
  specifications yet.
